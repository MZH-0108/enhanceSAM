# M2 P1 loss ablation from r16: loss.w_bound=0.0.
model:
  type: "vit_b"
  img_size: 512
  vit_embed_dim: 768
  prompt_embed_dim: 256

lora:
  use_lora: true
  rank: 16
  alpha: 32.0
  dropout: 0.1
  target_modules:
    - "qkv"
    - "proj"
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
    - "lin1"
    - "lin2"

boundary:
  use_boundary: false
  mid_channels: 64
  num_iterations: 3
  detector_mid: 64

loss:
  w_bce: 1.0
  w_dice: 2.0
  w_bound: 0.0
  pos_weight: 10.0
  boundary_radius: 3

training:
  batch_size: 4
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 0

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: "cosine"
  warmup_epochs: 5
  min_lr: 1.0e-6

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5

checkpoint:
  save_interval: 1
  save_best: true
  monitor: "val_iou"

logging:
  log_interval: 10
  use_tensorboard: true
  tensorboard_dir: "logs/"

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001
